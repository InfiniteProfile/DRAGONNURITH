<!doctype html>
<html lang="en">
<head>

<title>DRAGONNŪRITH – Infinite Baby Dragons</title>
<meta name="description" content="An endless universe of baby dragons. Every one has its own name, species, ability and story.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<header>

    <span class="egg" aria-hidden="true"></span>
    <div><h1>DRAGONNŪRITH</h1><p>Infinite baby dragons. One magical universe.</p></div>

  <div class="tools">
    <input id="q" type="search" placeholder="Search name, species, element, ability or ID (DN-000123)" autocomplete="off" spellcheck="false" aria-label="Search dragons">

<main>
  <div id="feed"></div>
  <div id="res" class="page" hidden></div>

<dialog id="dlg" aria-label="Dragon profile"></dialog>
